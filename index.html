<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZER | Official Links</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 0%, rgba(255, 0, 70, 0.18), transparent 28%),
        radial-gradient(circle at 10% 50%, rgba(120, 0, 255, 0.22), transparent 30%),
        radial-gradient(circle at 90% 60%, rgba(0, 130, 255, 0.18), transparent 30%),
        linear-gradient(180deg, #05050d 0%, #090014 45%, #03050d 100%);
    overflow-x: hidden;
}

/* BACKGROUND EFFECT */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(0,255,255,0.04) 50%,
            transparent 100%
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 45px,
            rgba(255,255,255,0.025) 46px,
            transparent 48px
        );
}

/* CONTAINER */
.container {
    width: 100%;
    max-width: 620px;
    margin: auto;
    padding: 50px 20px 40px;
    position: relative;
    z-index: 1;
}

/* FOTO PROFIL */
.profile {
    width: 175px;
    height: 175px;
    margin: 0 auto 22px;
    border-radius: 50%;
    padding: 5px;

    background: linear-gradient(
        135deg,
        #ffffff,
        #ff003c,
        #ff0066
    );

    box-shadow:
        0 0 15px rgba(255,0,70,0.8),
        0 0 35px rgba(255,0,70,0.5),
        0 0 70px rgba(255,0,70,0.25);
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
}

/* JUDUL */
h1 {
    text-align: center;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 7px;

    text-shadow:
        0 0 10px rgba(255,255,255,0.5),
        0 0 25px rgba(255,0,70,0.7);
}

.line {
    width: 72px;
    height: 4px;
    margin: 14px auto 18px;
    border-radius: 50px;

    background: #ff174d;

    box-shadow:
        0 0 15px #ff174d,
        0 0 30px rgba(255,23,77,0.5);
}

.description {
    text-align: center;
    font-size: 16px;
    line-height: 1.7;
    color: #dddddd;
    margin-bottom: 30px;
}

/* LINKS */
.links {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* BUTTON */
.link {
    position: relative;
    overflow: hidden;

    text-decoration: none;
    color: white;

    min-height: 88px;
    border-radius: 20px;

    display: flex;
    align-items: center;

    padding: 13px 17px;

    border: 1px solid rgba(255,255,255,0.20);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.40),
        inset 0 1px 0 rgba(255,255,255,0.12);

    transition:
        transform 0.25s ease,
        filter 0.25s ease;
}

/* EFEK GARIS BERJALAN */
.link::before {
    content: "";

    position: absolute;

    width: 170%;
    height: 300%;

    top: -100%;
    left: -35%;

    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            transparent 310deg,
            rgba(255,255,255,0.15) 325deg,
            #ffffff 340deg,
            rgba(255,255,255,0.20) 355deg,
            transparent 360deg
        );

    animation: borderMove 4s linear infinite;
}

/* PENUTUP AGAR ISI TOMBOL AMAN */
.link::after {
    content: "";

    position: absolute;

    inset: 2px;

    border-radius: 18px;

    background: inherit;

    z-index: 0;
}

/* ISI TOMBOL */
.link > * {
    position: relative;
    z-index: 2;
}

/* ANIMASI GARIS */
@keyframes borderMove {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

/* HOVER */
.link:hover {
    transform: translateY(-3px);
    filter: brightness(1.08);
}

/* KLIK */
.link:active {
    transform: scale(0.98);
}

/* ICON */
.icon {
    width: 54px;
    height: 54px;

    min-width: 54px;

    border-radius: 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;

    margin-right: 15px;

    background: rgba(255,255,255,0.13);

    box-shadow:
        inset 0 0 15px rgba(255,255,255,0.08);
}

/* TEXT */
.info {
    flex: 1;
}

.name {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 4px;
}

.sub {
    font-size: 13px;
    color: rgba(255,255,255,0.88);
}

/* PANAH */
.arrow {
    font-size: 40px;
    font-weight: 200;
    margin-left: 8px;
    line-height: 1;
}

/* ========================= */
/* WARNA TOMBOL */
/* ========================= */

.saweria {

        135deg,
        #ff9200,
        #ff6500
    );

    box-shadow:
        0 0 18px rgba(255,130,0,0.35),
        0 8px 25px rgba(0,0,0,0.4);
}

.sociabuzz {

        #ff005d,
        #ff315e
    );

    box-shadow:
        0 0 18px rgba(255,0,93,0.35),
        0 8px 25px rgba(0,0,0,0.4);
}

.discord {
    background: linear-gradient(
        135deg,
        #292b75,
        #6a36d9
    );

    box-shadow:
        0 0 18px rgba(90,60,255,0.35),
        0 8px 25px rgba(0,0,0,0.4);
}

.instagram {
    background: linear-gradient(
        135deg,
        #4a23a5,
        #e6007e,
        #ff8500
    );

    box-shadow:
        0 0 18px rgba(255,0,130,0.35),
        0 8px 25px rgba(0,0,0,0.4);
}

.telegram {
    background: linear-gradient(
        135deg,
        #1378b8,
        #29a9e8
    );

    box-shadow:
        0 0 18px rgba(0,150,255,0.35),
        0 8px 25px rgba(0,0,0,0.4);
}

.spotify {
    background: linear-gradient(
        135deg,
        #062d1b,
        #087d43
    );

    box-shadow:
        0 0 18px rgba(0,255,120,0.28),
        0 8px 25px rgba(0,0,0,0.4);
}

/* FOOTER */
footer {
    text-align: center;

    margin-top: 35px;
    padding-bottom: 10px;

    font-size: 15px;
    letter-spacing: 3px;

    color: #bdbdbd;
}

/* ========================= */
/* MOBILE */
/* ========================= */

@media (max-width: 480px) {

    .container {
        padding: 42px 16px 35px;
    }

    .profile {
        width: 155px;
        height: 155px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 46px;
        letter-spacing: 6px;
    }

    .description {
        font-size: 15px;
        margin-bottom: 28px;
    }

    .links {
        gap: 13px;
    }

    .link {
        min-height: 82px;
        padding: 12px 15px;
        border-radius: 19px;
    }

    .link::after {
        border-radius: 17px;
    }

    .icon {
        width: 50px;
        height: 50px;
        min-width: 50px;

        font-size: 25px;

        margin-right: 13px;

        border-radius: 16px;
    }

    .name {
        font-size: 20px;
    }

    .sub {
        font-size: 12px;
    }

    .arrow {
        font-size: 36px;
    }
}
</style>
