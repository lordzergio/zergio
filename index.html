<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZER | Official Links</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 0%, rgba(255, 0, 70, 0.18), transparent 28%),
        radial-gradient(circle at 10% 50%, rgba(120, 0, 255, 0.22), transparent 30%),
        radial-gradient(circle at 90% 60%, rgba(0, 130, 255, 0.18), transparent 30%),
        linear-gradient(180deg, #05050d 0%, #090014 45%, #03050d 100%);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background:
        linear-gradient(90deg, transparent 0%, rgba(0,255,255,0.04) 50%, transparent 100%),
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 45px,
            rgba(255,255,255,0.025) 46px,
            transparent 48px
        );
}

.container {
    width: 100%;
    max-width: 620px;
    margin: auto;
    padding: 55px 22px 45px;
    position: relative;
    z-index: 1;
}

/* FOTO */
.profile {
    width: 190px;
    height: 190px;
    margin: 0 auto 25px;
    border-radius: 50%;
    padding: 6px;
    background: linear-gradient(135deg, #ffffff, #ff003c, #ff0066);
    box-shadow:
        0 0 15px rgba(255,0,70,0.9),
        0 0 40px rgba(255,0,70,0.6),
        0 0 80px rgba(255,0,70,0.3);
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
}

/* JUDUL */
h1 {
    text-align: center;
    font-size: 54px;
    font-weight: 900;
    letter-spacing: 7px;
    text-shadow:
        0 0 10px rgba(255,255,255,0.5),
        0 0 25px rgba(255,0,70,0.7);
}

.line {
    width: 75px;
    height: 4px;
    margin: 15px auto 20px;
    border-radius: 50px;
    background: #ff174d;
    box-shadow: 0 0 15px #ff174d;
}

.description {
    text-align: center;
    font-size: 17px;
    line-height: 1.7;
    color: #dddddd;
    margin-bottom: 35px;
}

/* BUTTON */
.links {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.link {
    text-decoration: none;
    color: white;
    min-height: 105px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    padding: 18px 22px;
    transition: 0.25s ease;
    border: 1px solid rgba(255,255,255,0.28);
    box-shadow:
        0 8px 25px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.15);
}

.link:active {
    transform: scale(0.97);
}

.icon {
    width: 62px;
    height: 62px;
    min-width: 62px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-right: 17px;
    background: rgba(255,255,255,0.13);
    box-shadow: inset 0 0 15px rgba(255,255,255,0.08);
}

.info {
    flex: 1;
}

.name {
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 7px;
}

.sub {
    font-size: 15px;
    color: rgba(255,255,255,0.88);
}

.arrow {
    font-size: 45px;
    font-weight: 200;
    margin-left: 10px;
}

/* WARNA TOMBOL */
.saweria {
    background: linear-gradient(135deg, #ff9200, #ff6500);
    box-shadow:
        0 0 18px rgba(255,130,0,0.45),
        0 8px 25px rgba(0,0,0,0.4);
}

.sociabuzz {
    background: linear-gradient(135deg, #ff005d, #ff315e);
    box-shadow:
        0 0 18px rgba(255,0,93,0.4),
        0 8px 25px rgba(0,0,0,0.4);
}

.discord {
    background: linear-gradient(135deg, #292b75, #6a36d9);
    box-shadow:
        0 0 18px rgba(90,60,255,0.45),
        0 8px 25px rgba(0,0,0,0.4);
}

.instagram {
    background: linear-gradient(135deg, #4a23a5, #e6007e, #ff8500);
    box-shadow:
        0 0 18px rgba(255,0,130,0.4),
        0 8px 25px rgba(0,0,0,0.4);
}

.telegram {
    background: linear-gradient(135deg, #1378b8, #29a9e8);
    box-shadow:
        0 0 18px rgba(0,150,255,0.4),
        0 8px 25px rgba(0,0,0,0.4);
}

.spotify {
    background: linear-gradient(135deg, #062d1b, #087d43);
    box-shadow:
        0 0 18px rgba(0,255,120,0.3),
        0 8px 25px rgba(0,0,0,0.4);
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 45px;
    padding-bottom: 15px;
    font-size: 17px;
    letter-spacing: 4px;
    color: #cccccc;
}

/* MOBILE */
@media (max-width: 480px) {
    .container {
        padding: 45px 16px 35px;
    }

    .profile {
        width: 165px;
        height: 165px;
    }

    h1 {
        font-size: 45px;
    }

    .link {
        min-height: 95px;
        padding: 15px 17px;
    }

    .icon {
        width: 54px;
        height: 54px;
        min-width: 54px;
        font-size: 27px;
        margin-right: 14px;
    }

    .name {
        font-size: 21px;
    }

    .sub {
        font-size: 13px;
    }
}
</style>
</head>
