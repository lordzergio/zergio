<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zergio | Official Links</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,0.55),
        rgba(0,0,0,0.80)
    ),
    url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;
}

.container{
    width:100%;
    max-width:500px;

    padding:40px 20px;

    text-align:center;
}

.profile{
    width:120px;
    height:120px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid white;

    margin-bottom:18px;

    box-shadow:0 0 30px rgba(0,0,0,0.6);
}

h1{
    font-size:30px;
    margin-bottom:8px;

    letter-spacing:1px;
}

.bio{
    color:#e0e0e0;
    font-size:15px;

    margin-bottom:30px;

    line-height:1.6;
}

.links{
    display:flex;
    flex-direction:column;

    gap:15px;
}

.link{
    display:flex;

    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:white;

    font-weight:bold;

    padding:18px;

    border-radius:15px;

    background:rgba(255,255,255,0.14);

    border:1px solid rgba(255,255,255,0.25);

    backdrop-filter:blur(10px);

    transition:0.25s;

    box-shadow:
    0 8px 25px
    rgba(0,0,0,0.25);
}

.link:hover{
    transform:scale(1.03);

    background:rgba(255,255,255,0.25);
}

.saweria{
    background:linear-gradient(
        135deg,
        #ff7a00,
        #ffb000
    );
}

.socialbuzz{
    background:linear-gradient(
        135deg,
        #ff006e,
        #ff4d8d
    );
}

.telegram{
    background:linear-gradient(
        135deg,
        #0088cc,
        #29b6f6
    );
}

.instagram{
    background:linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );
}

.tiktok{
    background:#111;
}

.roblox{
    background:#e2231a;
}

.footer{
    margin-top:35px;

    font-size:12px;

    color:#bbbbbb;
}

</style>
</head>

<body>

<div class="container">

<img
class="profile"
src="https://avatars.githubusercontent.com/u/1?v=4"
alt="Zergio"
>

<h1>ZERGIO</h1>

<p class="bio">
Welcome to Zergio's official links.<br>
Support and connect with me below.
</p>

<div class="links">

<a href="https://saweria.co/" target="_blank" class="link saweria">
☕ Saweria
</a>

<a href="https://sociabuzz.com/" target="_blank" class="link socialbuzz">
💖 Sociabuzz
</a>

<a href="https://t.me/" target="_blank" class="link telegram">
✈️ Telegram
</a>

<a href="https://instagram.com/" target="_blank" class="link instagram">
📸 Instagram
</a>

<a href="https://tiktok.com/" target="_blank" class="link tiktok">
🎵 TikTok
</a>

<a href="https://roblox.com/" target="_blank" class="link roblox">
🎮 Roblox
</a>

</div>

<div class="footer">
© 2026 ZERGIO
</div>

</div>

</body>
  </html>
